<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>diffish</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --line: #2a2f38;
        --text: #c9d1d9;
        --dim: #6e7681;
        --accent: #5b8def;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 5px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
      input {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--text);
        padding: 6px 10px;
        font: inherit;
        width: 220px;
      }
      input:focus, select:focus { outline: 1px solid var(--accent); }
      select {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--text);
        padding: 5px 8px;
        font: inherit;
        max-width: 160px;
      }
      select:disabled { color: var(--dim); }
      .mode, .branches { display: flex; align-items: center; gap: 6px; }
      .mode label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--dim); }
      .mode input { width: auto; accent-color: var(--accent); }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; padding: 0; list-style: none; }
      .legend li { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 11px; }
      .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      #status { color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
      main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
      #cy { min-height: 0; }
      #panel {
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 14px;
        overflow-y: auto;
      }
      #panel h2 { font-size: 13px; margin: 0 0 10px; word-break: break-all; }
      #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 16px 0 6px; }
      #panel ul { margin: 0; padding-left: 16px; }
      #panel li { word-break: break-all; margin-bottom: 2px; }
      .count { color: var(--text); }
      .dim { color: var(--dim); }
      .error { color: #f85149; word-break: break-word; }
    </style>
  </head>
  <body>
    <header>
      <button id="open-project">Open Project</button>
      <span class="mode">
        <label><input type="radio" name="mode" value="diff" checked /> Diff</label>
        <label><input type="radio" name="mode" value="repo" /> Repo</label>
      </span>
      <span class="branches">
        <select id="base" disabled></select>
        <span class="dim">…</span>
        <select id="compare" disabled></select>
      </span>
      <input id="search" type="search" placeholder="Filter files…" />
      <span id="status">Ready</span>
    </header>
    <main>
      <div id="cy"></div>
      <aside id="panel"><p class="dim">Open a project to begin.</p></aside>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
