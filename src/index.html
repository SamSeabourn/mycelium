<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>diffish</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <button id="open-project" class="btn btn-primary btn-sm">Open Project</button>
      <span class="branches">
        <select id="base" class="select select-sm" disabled></select>
        <span class="opacity-50">…</span>
        <select id="compare" class="select select-sm" disabled></select>
      </span>
      <input id="search" class="input input-sm" type="search" placeholder="Filter functions…" />
      <span id="status">Ready</span>
    </header>
    <main>
      <div id="cy"></div>
      <div id="divider" title="Drag to resize"></div>
      <aside id="panel"><p class="path">Open a project to begin.</p></aside>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
